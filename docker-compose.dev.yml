services:
  backend_ia:
    build: ./backend_ia
    container_name: backend_ia
    working_dir: /app
    command: uvicorn app:app --host 0.0.0.0 --port 9000
    environment:
      - PYTHONPATH=/app
    ports:
      - "9000:9000"
    volumes:
      - ./backend_ia:/app
    networks:
      - bigdata-net

  backend_node:
    image: node:20.19
    container_name: backend_node
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - DB_NAME=recommendation_db
      - JWT_SECRET=jwt_super_securise
      - JWT_EXPIRES_IN=7d
      - PORT=4000
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    volumes:
      - ./backend_node:/app
      - node-modules-back:/app/node_modules
    networks:
      - bigdata-net

  frontend:
    image: node:20.19
    container_name: frontend
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node-modules-front:/app/node_modules
    networks:
      - bigdata-net

volumes:
  node-modules-back:
  node-modules-front:

networks:
  bigdata-net:
    external: true