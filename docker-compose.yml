services:
  # ----------------- HADOOP -----------------
  namenode:
    image: apache/hadoop:3
    hostname: namenode
    container_name: hadoop-namenode
    command: ["hdfs", "namenode"]
    env_file:
      - ./config/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    ports:
      - "9870:9870"
      - "8020:8020"
    networks:
      - bigdata-net

  datanode1:
    image: apache/hadoop:3
    hostname: datanode1
    container_name: hadoop-datanode1
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "9864:9864"
    networks:
      - bigdata-net

  datanode2:
    image: apache/hadoop:3
    hostname: datanode2
    container_name: hadoop-datanode2
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "9865:9864"
    networks:
      - bigdata-net

  datanode3:
    image: apache/hadoop:3
    hostname: datanode3
    container_name: hadoop-datanode3
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "9866:9864"
    networks:
      - bigdata-net

  resourcemanager:
    image: apache/hadoop:3
    hostname: resourcemanager
    container_name: hadoop-resourcemanager
    command: ["yarn", "resourcemanager"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "8088:8088"
    networks:
      - bigdata-net

  nodemanager:
    image: apache/hadoop:3
    hostname: nodemanager
    container_name: hadoop-nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config/hadoop.env
    networks:
      - bigdata-net

  # ----------------- KAFKA -----------------
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    env_file:
      - ./config/kafka.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bigdata-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8081:8080"
    env_file:
      - ./config/kafka-ui.env
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # ----------------- SPARK -----------------
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    hostname: spark-master
    depends_on:
      - namenode
      - kafka
    environment:
      - SPARK_MASTER_HOST=spark-master
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - bigdata-net

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    ports:
      - "8082:8081"
    networks:
      - bigdata-net

  # ----------------- HBASE + ZOOKEEPER -----------------
  zookeeper-hb:
    image: zookeeper:3.9
    container_name: zookeeper-hb
    hostname: zookeeper-hb
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper-hb:2888:3888
    networks:
      - bigdata-net
  
  hbase-master:
    image: harisekhon/hbase:latest
    container_name: hbase-master
    hostname: hbase-master
    depends_on:
      - zookeeper-hb
    environment:
      HBASE_MANAGES_ZK: "false"
      ZOOKEEPER_QUORUM: zookeeper-hb
    ports:
      - "16010:16010"    # UI HBase Master
      - "16000:16000"    # RPC Master
    networks:
      - bigdata-net

  hbase-region:
    image: harisekhon/hbase:latest
    container_name: hbase-region
    hostname: hbase-region
    depends_on:
      - hbase-master
      - zookeeper-hb
    environment:
      HBASE_MANAGES_ZK: "false"
      ZOOKEEPER_QUORUM: zookeeper-hb
    ports:
      - "16030:16030"    # UI RegionServer
      - "16201:16201"    # RPC RegionServer
    networks:
      - bigdata-net


  hbase-init:
    image: harisekhon/hbase:latest
    container_name: hbase-init
    hostname: hbase-init
    depends_on:
      - hbase-master
      - zookeeper-hb
    volumes:
      - ./hbase-init:/hbase-init
    entrypoint: ["bash", "/hbase-init/init-hbase.sh"]
    networks:
      - bigdata-net

  # ----------------- POSTGRES -----------------
  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres 
    environment:
      POSTGRES_USER: admin 
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: recommendation_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bigdata-net
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bigdata-net

  

volumes:
  kafka-data:
  spark-data:
  pgdata:

networks:
  bigdata-net:
    name: bigdata-net
