
services:
  # ----------------- HADOOP -----------------
  namenode:
    image: apache/hadoop:3
    container_name: hadoop-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file:
      - ./config/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    ports:
      - "9870:9870"
      - "8020:8020"
    networks:
      - bigdata-net

  datanode1:
    image: apache/hadoop:3
    container_name: hadoop-datanode1
    hostname: datanode1
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "9864:9864"
    networks:
      - bigdata-net

  datanode2:
    image: apache/hadoop:3
    container_name: hadoop-datanode2
    hostname: datanode2
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "9865:9864"
    networks:
      - bigdata-net

  datanode3:
    image: apache/hadoop:3
    container_name: hadoop-datanode3
    hostname: datanode3
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "9866:9864"
    networks:
      - bigdata-net

  resourcemanager:
    image: apache/hadoop:3
    container_name: hadoop-resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    env_file:
      - ./config/hadoop.env
    ports:
      - "8088:8088"
    networks:
      - bigdata-net

  nodemanager:
    image: apache/hadoop:3
    container_name: hadoop-nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config/hadoop.env
    networks:
      - bigdata-net

  # ----------------- KAFKA -----------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    env_file:
      - ./config/kafka.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bigdata-net

  topic-init:
    image: apache/kafka:latest
    container_name: kafka-topic-init
    depends_on:
      - kafka
    volumes:
      - ./config/init-kafka-topics.sh:/init-kafka-topics.sh
    entrypoint: ["sh", "/init-kafka-topics.sh"]
    networks:
      - bigdata-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8081:8080"
    env_file:
      - ./config/kafka-ui.env
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # ----------------- SPARK -----------------
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    hostname: spark-master
    depends_on:
      - namenode
      - kafka
    environment:
      SPARK_MASTER_HOST: spark-master
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - bigdata-net

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER: spark://spark-master:7077
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    ports:
      - "8082:8081"
    networks:
      - bigdata-net

  spark-streaming:
    build: ./spark
    container_name: spark-streaming
    hostname: spark-streaming
    depends_on:
      - spark-master
      - kafka
    volumes:
      - ./spark/streaming_job.py:/app/spark/streaming_job.py
    command: "/spark/bin/spark-submit --master spark://spark-master:7077 --deploy-mode client --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0 /app/spark/streaming_job.py"
    networks:
      - bigdata-net

  # ----------------- POSTGRES -----------------
  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: recommendation_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bigdata-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bigdata-net

volumes:
  kafka-data:
  pgdata:
  spark-data:

networks:
  bigdata-net:
    name: bigdata-net
