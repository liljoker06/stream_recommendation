
services:
  # ----------------- MINIO -----------------
  minio:
    image: minio/minio
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"   # API  (9100 hôte → évite le conflit avec backend_ia:9000)
      - "9101:9001"   # Console MinIO
    volumes:
      - minio-data:/data
    networks:
      - bigdata-net

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/gold;
      exit 0;
      "
    networks:
      - bigdata-net

  # ----------------- KAFKA -----------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    env_file:
      - ./config/kafka.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bigdata-net

  topic-init:
    image: apache/kafka:latest
    container_name: kafka-topic-init
    depends_on:
      - kafka
    volumes:
      - ./config/init-kafka-topics.sh:/init-kafka-topics.sh
    entrypoint: ["sh", "/init-kafka-topics.sh"]
    networks:
      - bigdata-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8081:8080"
    env_file:
      - ./config/kafka-ui.env
    depends_on:
      - kafka
    networks:
      - bigdata-net

  # ----------------- SPARK -----------------
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    hostname: spark-master
    depends_on:
      - kafka
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - bigdata-net

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER: spark://spark-master:7077
    ports:
      - "8082:8081"
    networks:
      - bigdata-net

  spark-streaming:
    build: ./spark
    container_name: spark-streaming
    hostname: spark-streaming
    depends_on:
      - spark-master
      - kafka
      - minio
    volumes:
      - ./spark/streaming_job.py:/app/spark/streaming_job.py
    command: >
      /spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0,org.apache.hadoop:hadoop-aws:3.3.2,com.amazonaws:aws-java-sdk-bundle:1.11.1026
      /app/spark/streaming_job.py
    networks:
      - bigdata-net

  # ----------------- POSTGRES -----------------
  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: recommendation_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bigdata-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bigdata-net

volumes:
  kafka-data:
  pgdata:
  minio-data:

networks:
  bigdata-net:
    name: bigdata-net
